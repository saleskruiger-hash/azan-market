<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - AZAN MARKET</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#111827;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#fff;
font-size:28px;
font-weight:bold;
}

header a{
color:#fff;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:700px;
margin:50px auto;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:25px;
color:#555;
}

input,
textarea{
width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

textarea{
height:150px;
resize:none;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.info{
margin-top:25px;
padding-top:20px;
border-top:1px solid #ddd;
color:#666;
}
</style>
</head>

<body>

<header>

<div class="logo">AZAN MARKET</div>

<a href="dashboard.html">Dashboard</a>

</header>

<div class="container">

<h1>Support Center</h1>

<p>Need help? Send us your message below.</p>

<input type="text" id="name" placeholder="Your Name">

<input type="email" id="email" placeholder="Your Email">

<textarea id="message" placeholder="Describe your issue..."></textarea>

<button onclick="sendMessage()">Send Message</button>

<div class="info">
<strong>Email:</strong> adminazanmarket@gmail.com
</div>

</div>

<script>

function sendMessage(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let message=document.getElementById("message").value;

if(name=="" || email=="" || message==""){

alert("Please fill all fields.");

return;

}

alert("Support request sent successfully!");

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("message").value="";

}

</script>

</body>
</html>
