<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - AZAN MARKET</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#111827;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:40px auto;
padding:20px;
}

h1{
margin-bottom:30px;
}

.cart-box{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 0;
border-bottom:1px solid #ddd;
}

.price{
font-size:24px;
font-weight:bold;
color:#2563eb;
}

.total{
margin-top:30px;
font-size:28px;
font-weight:bold;
text-align:right;
}

.checkout{
margin-top:30px;
text-align:right;
}

.checkout a{
display:inline-block;
padding:15px 35px;
background:#10b981;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
}

.empty{
text-align:center;
font-size:20px;
padding:50px;
color:#777;
}
</style>

</head>

<body>

<header>

<div class="logo">
AZAN MARKET
</div>

<a href="index.html">Home</a>

</header>

<div class="container">

<h1>Your Shopping Cart</h1>

<div class="cart-box">

<div id="cartItems"></div>

<div class="total" id="totalPrice"></div>

<div class="checkout">

<a href="#">Proceed To Checkout</a>

</div>

</div>

</div>
<script>

let product = JSON.parse(localStorage.getItem("cart"));

if(product){

document.getElementById("cartItems").innerHTML=`

<div class="item">

<div>

<h2>${product.name}</h2>

<p>${product.country}</p>

<p>${product.category}</p>

</div>

<div class="price">

$${product.price}

</div>

</div>

`;

document.getElementById("totalPrice").innerHTML="Total: $" + product.price;

}else{

document.getElementById("cartItems").innerHTML="<div class='empty'>Your Cart Is Empty</div>";

document.getElementById("totalPrice").innerHTML="";

}

</script>
</body>
</html>
