<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AZAN MARKET</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

.login-page{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:35px;
width:400px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
}

.login-box button{
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:17px;
}

.login-box p{
text-align:center;
}

.login-box a{
color:#2563eb;
text-decoration:none;
}
</style>

</head>

<body>

<div class="login-page">

<div class="login-box">

<h2>Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button onclick="window.location.href='index.html'">Login</button>

<p>Don't have an account? <a href="register.html">Register</a></p>

</div>

</div>

</body>
</html>
