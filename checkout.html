<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - AZAN MARKET</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#111827;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#fff;
font-size:28px;
font-weight:bold;
}

header a{
color:#fff;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:40px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.box{
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.box h2{
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

textarea{
height:120px;
resize:none;
}

.summary-item{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.total{
font-size:28px;
font-weight:bold;
margin:25px 0;
}

button{
width:100%;
padding:16px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<header>

<div class="logo">
AZAN MARKET
</div>

<a href="cart.html">← Back To Cart</a>

</header>

<div class="container">

<div class="box">

<h2>Customer Information</h2>

<input type="text" id="fullname" placeholder="Full Name"><br><br>

<input type="email" id="email" placeholder="Email"><br><br>

<h2>Guest Post Details</h2>

<input type="text" id="website" placeholder="Website URL"><br><br>

<input type="text" id="anchor" placeholder="Anchor Text"><br><br>

<input type="text" id="target" placeholder="Target URL"><br><br>

<textarea id="notes" placeholder="Special Instructions"></textarea>

<br><br>

<h2>Order Summary</h2>

<div id="orderSummary">
TechCrunch Guest Post - $500
</div>

<br>

<button id="placeOrder">
Place Order
</button>
<script>
</div>

<div class="box">

<h2>Order Summary</h2>

<div class="summary-item">
<span>🔥 TechCrunch Guest Post</span>
<span>$500</span>
</div>

<hr><br>

<div class="total">
Total: $500
</div>

</div>

</div>
document.getElementById("placeOrder").onclick=function(){

let fullname=document.getElementById("fullname").value;
let email=document.getElementById("email").value;
let website=document.getElementById("website").value;
let anchor=document.getElementById("anchor").value;
let target=document.getElementById("target").value;
let notes=document.getElementById("notes").value;

if(
fullname=="" ||
email=="" ||
website=="" ||
anchor=="" ||
target==""
){
alert("Please fill all required fields.");
return;
}

let order={

fullname:fullname,
email:email,
website:website,
anchor:anchor,
target:target,
notes:notes,
product:"TechCrunch Guest Post",
price:500

};

localStorage.setItem("order",JSON.stringify(order));

alert("Order Placed Successfully!");

window.location.href="dashboard.html";

};

</script>
</body>
</html>
