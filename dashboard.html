<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - AZAN MARKET</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#111827;
color:#fff;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logout{
background:#ef4444;
color:#fff;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
}

.container{
padding:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:30px;
}

.card{
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:15px;
}

.card a{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>
</head>

<body>

<header>

<div class="logo">
AZAN MARKET Dashboard
</div>

<a class="logout" href="#" onclick="logoutUser()">Logout</a>

</header>

<div class="container">

<h1>Welcome, <span id="username"></span></h1>

<p>Manage your account and guest post orders.</p>

<div class="cards">

<div class="card">
<h3>My Orders</h3>
<p>View all your guest post orders.</p>
<a href="orders.html">Open</a>
</div>

<div class="card">
<h3>Cart</h3>
<p>View websites added to your cart.</p>
<a href="#">Open</a>
</div>

<div class="card">
<h3>Profile</h3>
<p>Update your account information.</p>
<a href="#">Open</a>
</div>

<div class="card">
<h3>Support</h3>
<p>Contact our support team.</p>
<a href="#">Open</a>
</div>

</div>

</div>
<script>

let user = localStorage.getItem("fullname");

if(user){

document.getElementById("username").innerHTML = user;

}else{

document.getElementById("username").innerHTML = "Guest";

}

function logoutUser(){

localStorage.removeItem("fullname");
localStorage.removeItem("email");
localStorage.removeItem("password");

alert("Logged Out Successfully!");

window.location.href="login.html";

}

</script>
</body>
</html>
